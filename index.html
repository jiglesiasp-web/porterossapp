<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Porteros FS">
<meta name="theme-color" content="#0284c7">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Porteros FS · Maristas</title>
<style>
:root{--ink:#0f172a;--body:#334155;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#ffffff;--dark:#0284c7;--dark2:#0369a1;--track:#e9edf2;--barfill:#0284c7;--avbg:#0369a1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.header{position:sticky;top:0;z-index:10;background:rgba(241,245,249,.9);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:calc(18px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.header h1{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.05}
.back{background:none;border:none;color:var(--body);font-size:22px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:8px}
.back:active{background:#e2e8f0}
.sub{font-size:12px;color:var(--muted);margin-top:3px;font-weight:500}
.wrap{padding:16px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.gk-row{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer;transition:background .12s ease}
.gk-row:active{background:#f8fafc}
.avatar{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--avbg);color:#fff;font-size:14px;font-weight:700;letter-spacing:.02em;flex-shrink:0}
.gk-name{font-weight:700;color:var(--ink);font-size:15px;line-height:1.15}
.gk-team{font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.media{text-align:right;min-width:44px;font-size:19px;font-weight:800;color:var(--dark);line-height:1}
.media small{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:2px}
.media-badge{min-width:40px;height:40px;padding:0 8px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800}
.media-empty{min-width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-weight:700;border:1px dashed var(--line)}
.sect-title{font-size:13px;font-weight:800;color:var(--ink);margin:18px 0 10px;letter-spacing:-.01em}
.subhead{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:4px;letter-spacing:-.01em}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{font-size:12px;color:var(--body);width:130px;flex-shrink:0;font-weight:600}
.bar-track{flex:1;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--barfill);border-radius:4px}
.bar-val{font-size:13px;font-weight:800;color:var(--dark);width:22px;text-align:right}
.metrics{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.metric{font-size:12px;white-space:nowrap;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--body);cursor:pointer;font-weight:600}
.metric.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.wchips{display:flex;flex-wrap:wrap;gap:7px}
.wchip{font-size:13px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--body);cursor:pointer;font-weight:600}
.wchip.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;height:210px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.hist{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.hist .avg{font-size:14px;font-weight:800;color:var(--dark)}
.hist .date{font-size:12px;color:var(--muted);font-weight:600}
.hist .note{font-size:12px;color:var(--body);margin-top:4px;line-height:1.4}
.ttag{font-size:11px;background:#eef1f5;color:#334155;padding:2px 9px;border-radius:6px;font-weight:700}
.wmeta{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500}
.del{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:15px;padding:2px 4px;border-radius:6px}
.del:active{background:#f1f5f9}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;border:none;border-radius:10px;box-shadow:0 6px 18px rgba(15,23,42,.28);padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.01em}
.fab:active{background:var(--dark2);transform:translateX(-50%) scale(.97)}
label.f{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 7px;display:block;letter-spacing:.02em}
input.t,textarea.t,input[type=date],input[type=number]{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:16px;font-family:inherit;color:var(--ink);background:var(--card);font-weight:500}
input.t:focus,textarea.t:focus,input[type=date]:focus,input[type=number]:focus{outline:none;border-color:#0284c7;box-shadow:0 0 0 3px rgba(2,132,199,.15)}
textarea.t{resize:none}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.catbtn{font-size:14px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--body);cursor:pointer;font-weight:600}
.catbtn.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.save{width:100%;background:var(--dark);color:#fff;border:none;border-radius:11px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:22px;box-shadow:0 4px 14px rgba(15,23,42,.22);letter-spacing:.01em}
.save:active{background:var(--dark2)}
.save:disabled{opacity:.45;box-shadow:none}
.slider-row{margin-bottom:18px}
.slider-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.slider-top span:first-child{font-size:14px;color:var(--ink);font-weight:600}
.slider-val{font-size:15px;font-weight:800;color:var(--dark);min-width:26px;text-align:center}
input[type=range]{width:100%;accent-color:var(--dark);height:28px}
.empty{text-align:center;padding:64px 16px;color:var(--muted)}
.empty .big{width:66px;height:66px;border-radius:16px;background:#eef1f5;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:30px}
.empty-card{background:var(--card);border:1px dashed #cbd5e1;border-radius:12px;padding:34px 16px;text-align:center}
.hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.exp{font-size:12px;color:var(--body);border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--card);cursor:pointer;white-space:nowrap;font-weight:700}
.exp:active{background:#f1f5f9}
.notes-box{font-size:13px;color:var(--body);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:10px;line-height:1.5}
.report-btn{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:7px}
.report-btn:active{background:#f8fafc}
.editgk{font-size:13px;color:var(--body);background:var(--card);border:1px solid var(--line);border-radius:9px;cursor:pointer;margin-top:14px;padding:11px;display:block;width:100%;font-weight:700}
.editgk:active{background:#f1f5f9}
.delgk{font-size:13px;color:#b91c1c;background:var(--card);border:1px solid var(--line);border-radius:9px;cursor:pointer;margin-top:8px;padding:11px;display:block;width:100%;font-weight:700}
.delgk:active{background:#fef2f2}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--dark2);color:#fff;font-size:14px;font-weight:600;padding:11px 18px;border-radius:10px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.comp-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.cat-block{margin-bottom:20px}
.panel-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);-webkit-overflow-scrolling:touch}
.ptable{border-collapse:collapse;width:100%;font-size:13px}
.ptable th,.ptable td{padding:9px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable thead th{font-size:11px;color:var(--muted);font-weight:700;background:var(--card)}
.ptable td{font-weight:700;color:#0f172a}
.pstick{position:sticky;left:0;background:var(--card);text-align:left;z-index:1;box-shadow:1px 0 0 var(--line)}
.pname{color:var(--ink);min-width:120px}
.pcat{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:1px}
.pmedia{color:#fff}
.pna{color:#cbd5e1;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
var CATEGORIAS=['Benjamín','Alevín','Infantil','Cadete','Juvenil','Senior'];
var CAT_STYLE={'Benjamín':'background:#e0f2fe;color:#0369a1','Alevín':'background:#e0f2fe;color:#0369a1','Infantil':'background:#e0f2fe;color:#0369a1','Cadete':'background:#e0f2fe;color:#0369a1','Juvenil':'background:#e0f2fe;color:#0369a1','Senior':'background:#e0f2fe;color:#0369a1'};
var DEFAULT_COMPETENCIAS=[
 {key:'posicion',label:'Posición y blocaje'},
 {key:'achique',label:'Achique / 1v1'},
 {key:'saque',label:'Saque y transición'},
 {key:'pies',label:'Juego de pies'},
 {key:'reaccion',label:'Reacción'},
 {key:'colocacion',label:'Colocación'}
];
var DEFAULT_SESSION_TYPES=['Técnica','Táctica / 1v1','Físico','Con el equipo','Partido','Recuperación'];
var MAX_SCALE=10;
var REPORT_CSS='body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f1f5f9;color:#1e293b;margin:0;padding:20px}.report{max-width:720px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}.rhead{background:#0284c7;color:#fff;padding:24px}.rhead h1{margin:0;font-size:26px}.rhead .b{margin-top:6px;font-size:13px}.rhead .cat{display:inline-block;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:999px;font-weight:600;margin-right:8px}.rhead .stats{margin-top:12px;font-size:13px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}.rbody{padding:24px}.rbody h2{font-size:15px;color:#0f172a;margin:22px 0 12px;border-bottom:2px solid #e2e8f0;padding-bottom:6px}.rbody h2:first-child{margin-top:0}.br{display:flex;align-items:center;gap:10px;margin-bottom:8px}.bl{font-size:13px;color:#475569;width:150px;flex-shrink:0}.bt{flex:1;height:9px;background:#f1f5f9;border-radius:999px;overflow:hidden}.bf{display:block;height:100%;background:#0284c7;border-radius:999px}.bv{font-size:13px;font-weight:700;color:#0369a1;width:26px;text-align:right}.cols{display:flex;gap:16px;flex-wrap:wrap}.col{flex:1;min-width:200px}.coltitle{font-size:13px;font-weight:700;margin-bottom:8px}.col ul{margin:0;padding:0;list-style:none}.col li{padding:7px 10px;border-radius:8px;margin-bottom:6px;font-size:13px}.good li{background:#f8fafc;border-left:3px solid #cbd5e1}.work li{background:#f8fafc;border-left:3px solid #cbd5e1}.evo{font-size:13px;color:#475569;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-bottom:12px}.chartbox{border:1px solid #e2e8f0;border-radius:12px;padding:8px}.rfoot{padding:16px 24px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;text-align:center}.resumen{font-size:13px;color:#334155;line-height:1.55}.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:12.5px}.pl{color:#475569}.pv{color:#334155;white-space:nowrap}.obj{font-size:13px;color:#334155;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;line-height:1.5}';

var data={goalkeepers:[],evaluations:[],competencias:[],sessionTypes:[]};
var state={view:'roster',selectedId:null,metric:'General',formCat:'Benjamín',formFoot:'',editGkId:null,editList:[],editTypes:[],formSessionType:'',formWorked:[],editEvalId:null,panelCat:'Todas'};

function load(){
 try{var r=localStorage.getItem('fs_gk_data');if(r){var d=JSON.parse(r);data.goalkeepers=d.goalkeepers||[];data.evaluations=d.evaluations||[];data.competencias=d.competencias||[];data.sessionTypes=d.sessionTypes||[];data.scaleVersion=d.scaleVersion||1;}}catch(e){}
 if(!data.competencias||!data.competencias.length){data.competencias=DEFAULT_COMPETENCIAS.map(function(c){return {key:c.key,label:c.label};});}
 if(!data.sessionTypes||!data.sessionTypes.length){data.sessionTypes=DEFAULT_SESSION_TYPES.slice();}
 if(data.scaleVersion<2){data.evaluations.forEach(function(e){if(e&&e.ratings){for(var kk in e.ratings){if(typeof e.ratings[kk]==='number')e.ratings[kk]=Math.min(10,Math.round(e.ratings[kk]*2));}}});data.scaleVersion=2;save();}
 if(!data.scaleVersion)data.scaleVersion=2;
}
function save(){try{localStorage.setItem('fs_gk_data',JSON.stringify(data));}catch(e){}}
function uid(){try{return crypto.randomUUID();}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2);}}
function compKey(){return 'c_'+uid().slice(0,8);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function fmtShort(iso){var p=iso.split('-');return p[2]+'/'+p[1];}
function fmtLong(iso){var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(v){var n=parseFloat(v);return isNaN(n)?null:n;}
function slug(s){return (s||'portero').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'portero';}
function avg(r){var vals=[];data.competencias.forEach(function(c){var v=r[c.key];if(typeof v==='number')vals.push(v);});if(!vals.length)return 0;return Math.round((vals.reduce(function(a,b){return a+b;},0)/vals.length)*10)/10;}
function evalsFor(id){return data.evaluations.filter(function(e){return e.gkId===id;}).sort(function(a,b){return a.date.localeCompare(b.date);});}
function latestEval(id){var e=evalsFor(id);return e.length?e[e.length-1]:null;}
function gkById(id){return data.goalkeepers.find(function(g){return g.id===id;})||null;}
function statList(g){var s=[];if(g.foot)s.push('Pierna: '+g.foot);if(g.age!=null)s.push('Edad: '+g.age);if(g.height!=null)s.push('Altura: '+g.height+' cm');if(g.weight!=null)s.push('Peso: '+g.weight+' kg');return s;}
function workedLabels(keys){return (keys||[]).map(function(k){var c=data.competencias.find(function(x){return x.key===k;});return c?c.label:null;}).filter(Boolean);}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},1800);}
function initials(n){n=(n||'').trim();if(!n)return '?';var p=n.split(/\s+/);var s=p[0].charAt(0);if(p.length>1)s+=p[p.length-1].charAt(0);return s.toUpperCase();}
var AV_COLORS=['#0ea5e9','#6366f1','#ec4899','#f59e0b','#10b981','#ef4444','#8b5cf6','#14b8a6'];
function avatarColor(n){var h=0;n=n||'';for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return AV_COLORS[h%AV_COLORS.length];}
function mediaColor(v){var r=v/MAX_SCALE;if(r<0.4)return '#dc2626';if(r<0.6)return '#d97706';if(r<0.8)return '#16a34a';return '#15803d';}
function heatColor(v){var r=v/MAX_SCALE;if(r<0.4)return '#fee2e2';if(r<0.6)return '#fef3c7';if(r<0.8)return '#dcfce7';return '#bbf7d0';}
function norm(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function filterRoster(q){q=norm(q);var any=false;document.querySelectorAll('#app .cat-block').forEach(function(cb){var catAny=false;cb.querySelectorAll('.team-block').forEach(function(tb){var tAny=false;tb.querySelectorAll('.gk-row').forEach(function(r){var show=(!q||(r.getAttribute('data-name')||'').indexOf(q)>=0);r.style.display=show?'':'none';if(show)tAny=true;});tb.style.display=tAny?'':'none';if(tAny)catAny=true;});cb.style.display=catAny?'':'none';if(catAny)any=true;});var nr=document.getElementById('gk-nores');if(nr)nr.style.display=(any||!q)?'none':'';}

function chartSVG(evs,metric){
 var W=340,H=200,padL=20,padR=10,padT=10,padB=22;
 var iw=W-padL-padR,ih=H-padT-padB;
 var series=metric==='General'?evs:evs.filter(function(e){return typeof e.ratings[metric]==='number';});
 function val(e){return metric==='General'?avg(e.ratings):e.ratings[metric];}
 var n=series.length;
 function xFor(i){return n<=1?padL+iw/2:padL+iw*i/(n-1);}
 function yFor(v){return padT+ih*(1-v/MAX_SCALE);}
 var g='';
 (MAX_SCALE<=5?[0,1,2,3,4,5]:[0,2,4,6,8,10]).forEach(function(t){var y=yFor(t);g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#f1f5f9"/><text x="'+(padL-4)+'" y="'+(y+3)+'" font-size="9" fill="#94a3b8" text-anchor="end">'+t+'</text>';});
 var line='';
 if(n>1){var pts=series.map(function(e,i){return xFor(i).toFixed(1)+','+yFor(val(e)).toFixed(1);}).join(' ');line='<polyline points="'+pts+'" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round"/>';}
 var dots=series.map(function(e,i){return '<circle cx="'+xFor(i).toFixed(1)+'" cy="'+yFor(val(e)).toFixed(1)+'" r="3.2" fill="#0284c7"/>';}).join('');
 var xl='';
 series.forEach(function(e,i){if(n<=5||i===0||i===n-1||i===Math.floor((n-1)/2))xl+='<text x="'+xFor(i).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="#94a3b8" text-anchor="middle">'+fmtShort(e.date)+'</text>';});
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:100%">'+g+line+dots+xl+'</svg>';
}

function radarSVG(cur,prev){
 var comp=data.competencias;var N=comp.length;
 if(N<3)return '';
 var S=260,cx=130,cy=130,R=90,LN=MAX_SCALE;
 function ang(i){return (-90+i*360/N)*Math.PI/180;}
 function pt(i,rad){var a=ang(i);return [cx+rad*Math.cos(a),cy+rad*Math.sin(a)];}
 var g='';
 for(var L=1;L<=5;L++){var rr=R*L/5;var ps=[];for(var i=0;i<N;i++){var p=pt(i,rr);ps.push(p[0].toFixed(1)+','+p[1].toFixed(1));}g+='<polygon points="'+ps.join(' ')+'" fill="none" stroke="#e2e8f0" stroke-width="1"/>';}
 for(var i=0;i<N;i++){var e=pt(i,R);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="#e2e8f0" stroke-width="1"/>';var lp=pt(i,R+14);g+='<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3.5).toFixed(1)+'" font-size="11" fill="#64748b" text-anchor="middle" font-weight="bold">'+(i+1)+'</text>';}

 var body='';

 var evs=evalsFor(g.id);var latest=evs.length?evs[evs.length-1]:null;

 parts.push('<b>'+esc(g.name)+'</b> es un portero '+esc(g.category.toLowerCase())+edadTxt+footTxt+'. Con una valoración media de <b>'+mediaAct+'/'+MAX_SCALE+'</b>, se muestra '+resNivel+' para su categoría.');
 if(fuertes.length){var sf='Su punto más fuerte es <b>'+esc(fuertes[0].label)+'</b> ('+fuertes[0].v+'/'+MAX_SCALE+')';if(fuertes.length>1)sf+=', seguido de '+jl(fuertes.slice(1).map(function(x){return '<b>'+esc(x.label)+'</b>';}));sf+='.';parts.push(sf);}
 if(mejorar.length)parts.push('Donde más margen de mejora tiene es en '+jl(mejorar.map(function(x){return '<b>'+esc(x.label)+'</b>';}))+'.');
 if(hasProg){var mi=avg(first.ratings);var dd=Math.round((mediaAct-mi)*10)/10;var gains=comp.map(function(cc){var a=first.ratings[cc.key],b2=latest.ratings[cc.key];if(typeof a==='number'&&typeof b2==='number')return {label:cc.label,d:Math.round((b2-a)*10)/10};return null;}).filter(Boolean).sort(function(x,y){return y.d-x.d;});if(dd>0.05){var sp='En las '+evs.length+' sesiones registradas ha evolucionado de forma positiva, subiendo su media de '+mi+' a '+mediaAct+' (+'+dd+')';if(gains.length&&gains[0].d>0)sp+=', con su mayor avance en <b>'+esc(gains[0].label)+'</b> (+'+gains[0].d+')';sp+='.';parts.push(sp);}else if(dd<-0.05){parts.push('En las '+evs.length+' sesiones su media ha bajado de '+mi+' a '+mediaAct+' ('+dd+'); conviene revisar qué está afectando a su rendimiento.');}else{parts.push('Se mantiene estable en torno a '+mediaAct+' de media a lo largo de '+evs.length+' sesiones.');}}
 else parts.push('Es su primera sesión registrada; con más sesiones se podrá valorar su progresión.');
 if(arr.length>=3){var vv=arr.map(function(x){return x.v;});var mx=Math.max.apply(null,vv),mn=Math.min.apply(null,vv);var spread=mx-mn;if(spread>=0.4*MAX_SCALE)parts.push('Es un portero de perfil marcado, con diferencias claras entre sus mejores y peores facetas.');else if(spread<=0.2*MAX_SCALE)parts.push('Muestra un perfil equilibrado, con un rendimiento parejo en todas las facetas.');}
 if(g.objetivos)parts.push('Foco de trabajo marcado por el entrenador: '+esc(g.objetivos));
 else if(mejorar.length)parts.push('El trabajo próximo debería centrarse en '+jl(mejorar.map(function(x){return esc(x.label);}))+'.');
 var resumen=parts.join(' ');

 var radarBlock='';
 if(radar){radarBlock='<div style="max-width:330px;margin:0 auto 6px">'+radar+'</div>';if(hasProg)radarBlock+='<div style="text-align:center;font-size:11px;color:#94a3b8;margin-bottom:10px"><span style="color:#0284c7">&#9679;</span> Actual &nbsp;&nbsp; <span style="color:#94a3b8">&#9679;</span> Inicial</div>';}
 var bars=comp.map(function(c,ci){var v=latest.ratings[c.key];var isn=(typeof v==='number');var w=isn?Math.min(100,v/MAX_SCALE*100):0;return '<div class="br"><span class="bl">'+(ci+1)+'. '+esc(c.label)+'</span><span class="bt"><span class="bf" style="width:'+w+'%"></span></span><span class="bv">'+(isn?v+'/'+MAX_SCALE:'-')+'</span></div>';}).join('');

 if(hasProg){var rows=comp.map(function(c,ci){var a=first.ratings[c.key],b2=latest.ratings[c.key];if(typeof a!=='number'||typeof b2!=='number')return '';var dd=Math.round((b2-a)*10)/10;var col=dd>0?'#15803d':(dd<0?'#b91c1c':'#94a3b8');var sign=dd>0?'+':'';return '<div class="pr"><span class="pl">'+(ci+1)+'. '+esc(c.label)+'</span><span class="pv">'+a+' &rarr; '+b2+' <b style="color:'+col+'">('+sign+dd+')</b></span></div>';}).filter(Boolean).join('');var mi=avg(first.ratings);var dm=Math.round((mediaAct-mi)*10)/10;var sm=dm>0?'+':'';var cm=dm>0?'#15803d':(dm<0?'#b91c1c':'#94a3b8');progHTML='<div class="evo">Media general: <b>'+mi+'</b> &rarr; <b>'+mediaAct+'</b> <b style="color:'+cm+'">('+sm+dm+')</b> en '+evs.length+' sesiones (desde '+fmtShort(first.date)+').</div>'+rows;}
 else progHTML='<div class="evo">Primera sesión registrada ('+fmtShort(latest.date)+'). Con una segunda ver\u00e1s el progreso por cualidad.</div>';
 var objtxt;
 if(g.objetivos)objtxt=esc(g.objetivos);
 else{var low=arr.slice().sort(function(a,b){return a.v-b.v;}).slice(0,Math.min(2,arr.length)).map(function(x){return esc(x.label);});objtxt=low.length?('Foco sugerido: '+low.join(' y ')+' (sus \u00e1reas m\u00e1s bajas).'):'-';}
 var fH=fuertes.length?fuertes.map(function(x){return '<li><b>'+esc(x.label)+'</b> - '+x.v+'/'+MAX_SCALE+'</li>';}).join(''):'<li>-</li>';
 var mH=mejorar.length?mejorar.map(function(x){return '<li><b>'+esc(x.label)+'</b> - '+x.v+'/'+MAX_SCALE+'</li>';}).join(''):'<li>-</li>';

 return doc;
}

 b+='<div class="subhead">Cualidades a evaluar</div><div class="hint" style="margin-bottom:10px">Las que puntúas del 1 al 5 en cada portero.</div>';
 state.editList.forEach(function(c,idx){b+='<div class="comp-row"><input class="t comp-input" data-idx="'+idx+'" value="'+esc(c.label)+'" placeholder="Nombre de la cualidad"><button class="del" data-action="delComp" data-idx="'+idx+'" style="font-size:16px;padding:4px 6px">🗑</button></div>';});
 b+='<div style="display:flex;gap:8px;margin-top:8px"><input class="t" id="new-comp" placeholder="Añadir cualidad…"><button class="catbtn" data-action="addComp" style="width:auto;padding:10px 16px;flex-shrink:0">Añadir</button></div>';
 b+='<div class="subhead" style="margin-top:26px">Tipos de sesión</div><div class="hint" style="margin-bottom:10px">Para elegir al registrar cada sesión.</div>';
 state.editTypes.forEach(function(t,idx){b+='<div class="comp-row"><input class="t type-input" data-idx="'+idx+'" value="'+esc(t)+'" placeholder="Tipo de sesión"><button class="del" data-action="delType" data-idx="'+idx+'" style="font-size:16px;padding:4px 6px">🗑</button></div>';});
 b+='<div style="display:flex;gap:8px;margin-top:8px"><input class="t" id="new-type" placeholder="Añadir tipo…"><button class="catbtn" data-action="addType" style="width:auto;padding:10px 16px;flex-shrink:0">Añadir</button></div>';
 b+='<button class="save" data-action="saveSettings">Guardar cambios</button>';
 b+='</div>';
 return h+b;
}

function viewPanel(){
 var comp=data.competencias;
 var h='<div class="header"><button class="back" data-action="back">←</button><h1>Panel del equipo</h1></div>';
 var b='<div class="wrap">';
 if(!data.goalkeepers.length){return h+b+'<div class="empty-card"><div style="color:#64748b;font-size:14px">Aún no hay porteros.</div></div></div>';}
 var cats=CATEGORIAS.filter(function(cc){return data.goalkeepers.some(function(g){return g.category===cc;});});
 if(state.panelCat!=='Todas'&&cats.indexOf(state.panelCat)<0)state.panelCat='Todas';
 var opts=['Todas'].concat(cats);
 b+='<div class="metrics">';
 opts.forEach(function(o){b+='<button class="metric'+(state.panelCat===o?' active':'')+'" data-action="panelCat" data-cat="'+esc(o)+'">'+esc(o)+'</button>';});
 b+='</div>';
 var list=data.goalkeepers.filter(function(g){return state.panelCat==='Todas'||g.category===state.panelCat;});
 list.sort(function(a,b2){var ci=CATEGORIAS.indexOf(a.category)-CATEGORIAS.indexOf(b2.category);if(ci!==0)return ci;return (a.name||'').localeCompare(b2.name||'');});
 if(!list.length){return h+b+'<div class="hint" style="text-align:center;padding:20px 0">Sin porteros en esta categoría.</div></div>';}
 b+='<div class="panel-wrap"><table class="ptable"><thead><tr><th class="pstick">Portero</th>';
 comp.forEach(function(cc,ci){b+='<th title="'+esc(cc.label)+'">'+(ci+1)+'</th>';});
 b+='<th>Media</th></tr></thead><tbody>';
 list.forEach(function(g){var le=latestEval(g.id);b+='<tr><td class="pstick pname">'+esc(g.name)+(state.panelCat==='Todas'?'<span class="pcat">'+g.category+'</span>':'')+'</td>';comp.forEach(function(cc){var v=le?le.ratings[cc.key]:undefined;if(typeof v==='number'){b+='<td style="background:'+heatColor(v)+'">'+v+'</td>';}else{b+='<td class="pna">-</td>';}});if(le){var m=avg(le.ratings);b+='<td class="pmedia" style="background:'+mediaColor(m)+'">'+m+'</td>';}else{b+='<td class="pna">-</td>';}b+='</tr>';});
 b+='</tbody></table></div>';
 b+='<div class="hint" style="margin-top:12px"><b>Cualidades:</b> '+comp.map(function(cc,ci){return (ci+1)+' '+esc(cc.label);}).join('  ·  ')+'</div>';
 b+='<div class="hint" style="margin-top:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span>Escala:</span><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:13px;height:13px;border-radius:3px;background:#fee2e2;display:inline-block"></span>bajo</span><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:13px;height:13px;border-radius:3px;background:#fef3c7;display:inline-block"></span>medio</span><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:13px;height:13px;border-radius:3px;background:#bbf7d0;display:inline-block"></span>alto</span></div>';
 return h+b+'</div>';
}
function render(){
 var app=document.getElementById('app');
 if(state.view==='profile')app.innerHTML=viewProfile();
 else if(state.view==='gkForm')app.innerHTML=viewGkForm();
 else if(state.view==='newEval')app.innerHTML=viewNewEval();
 else if(state.view==='settings')app.innerHTML=viewSettings();
 else if(state.view==='panel')app.innerHTML=viewPanel();
 else app.innerHTML=viewRoster();
}

function syncSettingsInputs(){
 document.querySelectorAll('.comp-input').forEach(function(inp){var i=Number(inp.getAttribute('data-idx'));if(state.editList[i])state.editList[i].label=inp.value;});
 document.querySelectorAll('.type-input').forEach(function(inp){var i=Number(inp.getAttribute('data-idx'));if(typeof state.editTypes[i]!=='undefined')state.editTypes[i]=inp.value;});
}

document.addEventListener('click',function(e){
 var el=e.target.closest('[data-action]');if(!el)return;
 var a=el.getAttribute('data-action');
 if(a==='open'){state.selectedId=el.getAttribute('data-id');state.view='profile';state.metric='General';render();}
 else if(a==='addGk'){state.editGkId=null;state.formCat='Benjamín';state.formFoot='';state.view='gkForm';render();}
 else if(a==='editGk'){var eg=gkById(state.selectedId);if(!eg)return;state.editGkId=eg.id;state.formCat=eg.category;state.formFoot=eg.foot||'';state.view='gkForm';render();}
 else if(a==='back'){if(state.view==='newEval'){state.editEvalId=null;state.view='profile';}else if(state.view==='gkForm'){var bk=state.editGkId?'profile':'roster';state.editGkId=null;state.view=bk;}else{state.view='roster';}render();}
 else if(a==='newEval'){state.editEvalId=null;state.formSessionType='';state.formWorked=[];state.view='newEval';render();}
 else if(a==='metric'){state.metric=el.getAttribute('data-metric');render();}
 else if(a==='pickCat'){state.formCat=el.getAttribute('data-cat');document.querySelectorAll('[data-action="pickCat"]').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-cat')===state.formCat);});}
 else if(a==='pickFoot'){var f=el.getAttribute('data-foot');state.formFoot=(state.formFoot===f?'':f);document.querySelectorAll('[data-action="pickFoot"]').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-foot')===state.formFoot);});}
 else if(a==='pickType'){var tp=el.getAttribute('data-type');state.formSessionType=(state.formSessionType===tp?'':tp);document.querySelectorAll('[data-action="pickType"]').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-type')===state.formSessionType);});}
 else if(a==='toggleWorked'){var wk=el.getAttribute('data-worked');var wi=state.formWorked.indexOf(wk);if(wi>=0)state.formWorked.splice(wi,1);else state.formWorked.push(wk);el.classList.toggle('active');}
 else if(a==='saveGk'){var name=(document.getElementById('gk-name').value||'').trim();if(!name){toast('Pon un nombre');return;}var team=(document.getElementById('gk-team').value||'').trim();var age=parseInt(document.getElementById('gk-age').value,10);if(isNaN(age))age=null;var height=num(document.getElementById('gk-height').value);var weight=num(document.getElementById('gk-weight').value);var objetivos=(document.getElementById('gk-obj').value||'').trim();if(state.editGkId){var g=gkById(state.editGkId);g.name=name;g.category=state.formCat;g.team=team;g.foot=state.formFoot;g.age=age;g.height=height;g.weight=weight;g.objetivos=objetivos;save();state.selectedId=g.id;state.editGkId=null;state.view='profile';render();toast('Portero actualizado');}else{var gk={id:uid(),name:name,category:state.formCat,team:team,foot:state.formFoot,age:age,height:height,weight:weight,objetivos:objetivos};data.goalkeepers.push(gk);save();state.selectedId=gk.id;state.view='profile';state.metric='General';render();}}
 else if(a==='saveEval'){var g2=gkById(state.selectedId);if(!g2)return;var date=document.getElementById('ev-date').value||todayISO();var ratings={};document.querySelectorAll('input[type=range][data-key]').forEach(function(s){ratings[s.getAttribute('data-key')]=Number(s.value);});var note=(document.getElementById('ev-note').value||'').trim();if(state.editEvalId){var ev=data.evaluations.find(function(x){return x.id===state.editEvalId;});if(ev){ev.date=date;ev.ratings=ratings;ev.type=state.formSessionType||'';ev.worked=state.formWorked.slice();ev.note=note;}state.editEvalId=null;save();state.view='profile';render();toast('Sesión actualizada');}else{var ev2={id:uid(),gkId:g2.id,date:date,ratings:ratings,type:state.formSessionType||'',worked:state.formWorked.slice(),note:note};data.evaluations.push(ev2);save();state.view='profile';render();toast('Sesión guardada');}}
 else if(a==='shareReport'){var gr=gkById(state.selectedId);if(gr)shareReport(gr);}
 else if(a==='editEval'){var id=el.getAttribute('data-id');var ev=data.evaluations.find(function(x){return x.id===id;});if(!ev)return;state.editEvalId=id;state.formSessionType=ev.type||'';state.formWorked=(ev.worked||[]).slice();state.view='newEval';render();}
 else if(a==='delEval'){if(confirm('¿Eliminar esta sesión?')){var id=el.getAttribute('data-id');data.evaluations=data.evaluations.filter(function(x){return x.id!==id;});save();render();}}
 else if(a==='delGk'){if(confirm('¿Eliminar este portero y todas sus evaluaciones?')){var gid=state.selectedId;data.goalkeepers=data.goalkeepers.filter(function(x){return x.id!==gid;});data.evaluations=data.evaluations.filter(function(x){return x.gkId!==gid;});save();state.selectedId=null;state.view='roster';render();}}
 else if(a==='export'){var payload=JSON.stringify(data,null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(payload).then(function(){toast('Datos copiados (JSON)');}).catch(function(){toast('No se pudo copiar');});}else{toast('No se pudo copiar');}}
 else if(a==='openSettings'){state.editList=data.competencias.map(function(c){return {key:c.key,label:c.label};});state.editTypes=data.sessionTypes.slice();state.view='settings';render();}
 else if(a==='openPanel'){state.view='panel';render();}
 else if(a==='panelCat'){state.panelCat=el.getAttribute('data-cat');render();}
 else if(a==='addComp'){syncSettingsInputs();var inp=document.getElementById('new-comp');var v=(inp.value||'').trim();if(!v){toast('Escribe un nombre');return;}if(state.editList.length>=12){toast('Máximo 12 cualidades');return;}state.editList.push({key:compKey(),label:v});render();}
 else if(a==='delComp'){syncSettingsInputs();var di=Number(el.getAttribute('data-idx'));state.editList.splice(di,1);render();}
 else if(a==='addType'){syncSettingsInputs();var inpt=document.getElementById('new-type');var vt=(inpt.value||'').trim();if(!vt){toast('Escribe un tipo');return;}if(state.editTypes.length>=12){toast('Máximo 12 tipos');return;}state.editTypes.push(vt);render();}
 else if(a==='delType'){syncSettingsInputs();var dti=Number(el.getAttribute('data-idx'));state.editTypes.splice(dti,1);render();}
 else if(a==='saveSettings'){syncSettingsInputs();var cleaned=state.editList.map(function(c){return {key:c.key||compKey(),label:(c.label||'').trim()};}).filter(function(c){return c.label;});if(!cleaned.length){toast('Deja al menos una cualidad');return;}var cleanTypes=state.editTypes.map(function(t){return (t||'').trim();}).filter(function(t){return t;});data.competencias=cleaned;data.sessionTypes=cleanTypes;if(state.metric!=='General'&&!cleaned.some(function(c){return c.key===state.metric;}))state.metric='General';save();state.view='roster';render();toast('Ajustes guardados');}
});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='gk-search'){filterRoster(e.target.value);return;}var s=e.target.closest('input[type=range][data-key]');if(s){var d=document.getElementById('val-'+s.getAttribute('data-key'));if(d)d.textContent=s.value;}});

load();render();
</script>
</body>
</html>
