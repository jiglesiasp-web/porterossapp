<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Porteros FS">
<meta name="theme-color" content="#0284c7">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Porteros FS · Maristas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8fafc;color:#1e293b;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.header{position:sticky;top:0;z-index:10;background:#f8fafc;padding:20px 16px 12px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:12px}
.header h1{font-size:20px;font-weight:700;color:#0f172a;line-height:1.1}
.sub{font-size:12px;color:#64748b;margin-top:2px}
.back{background:none;border:none;color:#94a3b8;font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
.wrap{padding:16px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-bottom:8px}
.gk-row{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.gk-row:active{background:#f1f5f9}
.avatar{width:36px;height:36px;border-radius:999px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:18px}
.gk-name{font-weight:500;color:#334155}
.gk-team{font-size:12px;color:#94a3b8}
.media{font-size:20px;font-weight:700;color:#0284c7;line-height:1}
.media small{display:block;font-size:10px;color:#94a3b8;font-weight:400}
.sect-title{font-size:14px;font-weight:600;color:#334155;margin:16px 0 8px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{font-size:12px;color:#64748b;width:130px;flex-shrink:0}
.bar-track{flex:1;height:8px;background:#f1f5f9;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:#0ea5e9;border-radius:999px}
.bar-val{font-size:12px;font-weight:600;color:#475569;width:18px;text-align:right}
.metrics{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.metric{font-size:12px;white-space:nowrap;padding:4px 10px;border-radius:999px;border:1px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer}
.metric.active{background:#0284c7;color:#fff;border-color:#0284c7}
.chart{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:8px;height:200px}
.hist{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:8px 12px;margin-bottom:8px}
.hist .avg{font-size:14px;font-weight:600;color:#0284c7}
.hist .date{font-size:12px;color:#94a3b8}
.hist .note{font-size:12px;color:#64748b;margin-top:2px}
.del{background:none;border:none;color:#cbd5e1;cursor:pointer;font-size:15px}
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0284c7;color:#fff;border:none;border-radius:999px;box-shadow:0 6px 16px rgba(2,132,199,.35);padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer}
.fab:active{background:#0369a1}
label.f{font-size:12px;font-weight:500;color:#64748b;margin:14px 0 6px;display:block}
input.t,textarea.t,input[type=date],input[type=number]{width:100%;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;font-size:16px;font-family:inherit;color:#1e293b;background:#fff}
input.t:focus,textarea.t:focus,input[type=date]:focus,input[type=number]:focus{outline:none;border-color:#38bdf8}
textarea.t{resize:none}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catbtn{font-size:14px;padding:10px;border-radius:12px;border:1px solid #e2e8f0;background:#fff;color:#475569;cursor:pointer}
.catbtn.active{background:#0284c7;color:#fff;border-color:#0284c7}
.save{width:100%;background:#0284c7;color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;margin-top:20px}
.slider-row{margin-bottom:16px}
.slider-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.slider-top span:first-child{font-size:14px;color:#334155}
.slider-val{font-size:14px;font-weight:700;color:#0284c7}
input[type=range]{width:100%;accent-color:#0284c7;height:26px}
.empty{text-align:center;padding:56px 16px;color:#94a3b8}
.empty .big{width:56px;height:56px;border-radius:999px;background:#e0f2fe;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:26px}
.empty-card{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:32px 16px;text-align:center}
.hint{font-size:12px;color:#94a3b8;margin-top:4px}
.exp{font-size:12px;color:#64748b;border:1px solid #e2e8f0;border-radius:10px;padding:6px 10px;background:#fff;cursor:pointer;white-space:nowrap}
.notes-box{font-size:13px;color:#475569;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px 12px;margin-bottom:10px}
.report-btn{width:100%;background:#fff;color:#0284c7;border:1px solid #bae6fd;border-radius:12px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.report-btn:active{background:#f0f9ff}
.editgk{font-size:12px;color:#0284c7;background:none;border:none;cursor:pointer;margin-top:12px;padding:8px 0;display:block}
.delgk{font-size:12px;color:#fb7185;background:none;border:none;cursor:pointer;margin-top:2px;padding:8px 0;display:block}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:14px;padding:8px 16px;border-radius:999px;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.comp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var CATEGORIAS=['Benjamín','Alevín','Infantil','Cadete','Juvenil','Senior'];
var CAT_STYLE={
 'Benjamín':'background:#d1fae5;color:#047857',
 'Alevín':'background:#e0f2fe;color:#0369a1',
 'Infantil':'background:#e0e7ff;color:#4338ca',
 'Cadete':'background:#ffe4e6;color:#be123c',
 'Juvenil':'background:#fef3c7;color:#b45309',
 'Senior':'background:#ede9fe;color:#6d28d9'
};
var DEFAULT_COMPETENCIAS=[
 {key:'posicion',label:'Posición y blocaje'},
 {key:'achique',label:'Achique / 1v1'},
 {key:'saque',label:'Saque y transición'},
 {key:'pies',label:'Juego de pies'},
 {key:'reaccion',label:'Reacción'},
 {key:'colocacion',label:'Colocación'}
];
var MAX_SCALE=5;
var REPORT_CSS='body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f1f5f9;color:#1e293b;margin:0;padding:20px}.report{max-width:720px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}.rhead{background:#0284c7;color:#fff;padding:24px}.rhead h1{margin:0;font-size:26px}.rhead .b{margin-top:6px;font-size:13px}.rhead .cat{display:inline-block;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:999px;font-weight:600;margin-right:8px}.rhead .stats{margin-top:12px;font-size:13px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}.rbody{padding:24px}.rbody h2{font-size:15px;color:#0f172a;margin:22px 0 12px;border-bottom:2px solid #e2e8f0;padding-bottom:6px}.rbody h2:first-child{margin-top:0}.br{display:flex;align-items:center;gap:10px;margin-bottom:8px}.bl{font-size:13px;color:#475569;width:150px;flex-shrink:0}.bt{flex:1;height:9px;background:#f1f5f9;border-radius:999px;overflow:hidden}.bf{display:block;height:100%;background:#0ea5e9;border-radius:999px}.bv{font-size:13px;font-weight:700;color:#0284c7;width:26px;text-align:right}.cols{display:flex;gap:16px;flex-wrap:wrap}.col{flex:1;min-width:200px}.coltitle{font-size:13px;font-weight:700;margin-bottom:8px}.col ul{margin:0;padding:0;list-style:none}.col li{padding:7px 10px;border-radius:8px;margin-bottom:6px;font-size:13px}.good li{background:#f0fdf4;border-left:3px solid #16a34a}.work li{background:#fffbeb;border-left:3px solid #d97706}.evo{font-size:13px;color:#475569;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-bottom:12px}.chartbox{border:1px solid #e2e8f0;border-radius:12px;padding:8px}.rfoot{padding:16px 24px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;text-align:center}';

var data={goalkeepers:[],evaluations:[],competencias:[]};
var state={view:'roster',selectedId:null,metric:'General',formCat:'Benjamín',formFoot:'',editGkId:null,editList:[]};

function load(){
 try{var r=localStorage.getItem('fs_gk_data');if(r){var d=JSON.parse(r);data.goalkeepers=d.goalkeepers||[];data.evaluations=d.evaluations||[];data.competencias=d.competencias||[];}}catch(e){}
 if(!data.competencias||!data.competencias.length){data.competencias=DEFAULT_COMPETENCIAS.map(function(c){return {key:c.key,label:c.label};});}
}
function save(){try{localStorage.setItem('fs_gk_data',JSON.stringify(data));}catch(e){}}
function uid(){try{return crypto.randomUUID();}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2);}}
function compKey(){return 'c_'+uid().slice(0,8);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function fmtShort(iso){var p=iso.split('-');return p[2]+'/'+p[1];}
function fmtLong(iso){var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(v){var n=parseFloat(v);return isNaN(n)?null:n;}
function slug(s){return (s||'portero').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'portero';}
function avg(r){var vals=[];data.competencias.forEach(function(c){var v=r[c.key];if(typeof v==='number')vals.push(v);});if(!vals.length)return 0;return Math.round((vals.reduce(function(a,b){return a+b;},0)/vals.length)*10)/10;}
function evalsFor(id){return data.evaluations.filter(function(e){return e.gkId===id;}).sort(function(a,b){return a.date.localeCompare(b.date);});}
function latestEval(id){var e=evalsFor(id);return e.length?e[e.length-1]:null;}
function gkById(id){return data.goalkeepers.find(function(g){return g.id===id;})||null;}
function statList(g){var s=[];if(g.foot)s.push('Pierna: '+g.foot);if(g.age!=null)s.push('Edad: '+g.age);if(g.height!=null)s.push('Altura: '+g.height+' cm');if(g.weight!=null)s.push('Peso: '+g.weight+' kg');return s;}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},1800);}

function chartSVG(evs,metric){
 var W=340,H=200,padL=20,padR=10,padT=10,padB=22;
 var iw=W-padL-padR,ih=H-padT-padB;
 var series=metric==='General'?evs:evs.filter(function(e){return typeof e.ratings[metric]==='number';});
 function val(e){return metric==='General'?avg(e.ratings):e.ratings[metric];}
 var n=series.length;
 function xFor(i){return n<=1?padL+iw/2:padL+iw*i/(n-1);}
 function yFor(v){return padT+ih*(1-v/MAX_SCALE);}
 var g='';
 [0,1,2,3,4,5].forEach(function(t){var y=yFor(t);g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#f1f5f9"/><text x="'+(padL-4)+'" y="'+(y+3)+'" font-size="9" fill="#94a3b8" text-anchor="end">'+t+'</text>';});
 var line='';
 if(n>1){var pts=series.map(function(e,i){return xFor(i).toFixed(1)+','+yFor(val(e)).toFixed(1);}).join(' ');line='<polyline points="'+pts+'" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round"/>';}
 var dots=series.map(function(e,i){return '<circle cx="'+xFor(i).toFixed(1)+'" cy="'+yFor(val(e)).toFixed(1)+'" r="3.2" fill="#0284c7"/>';}).join('');
 var xl='';
 series.forEach(function(e,i){if(n<=5||i===0||i===n-1||i===Math.floor((n-1)/2))xl+='<text x="'+xFor(i).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="#94a3b8" text-anchor="middle">'+fmtShort(e.date)+'</text>';});
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:100%">'+g+line+dots+xl+'</svg>';
}

function buildReportHTML(g){
 var evs=evalsFor(g.id);var latest=evs.length?evs[evs.length-1]:null;
 if(!latest)return '';
 var stats=statList(g);
 var statsHTML=stats.length?'<div class="stats">'+esc(stats.join('   ·   '))+'</div>':'';
 var bars=data.competencias.map(function(c){var v=latest.ratings[c.key];var isn=(typeof v==='number');var w=isn?Math.min(100,v/MAX_SCALE*100):0;return '<div class="br"><span class="bl">'+esc(c.label)+'</span><span class="bt"><span class="bf" style="width:'+w+'%"></span></span><span class="bv">'+(isn?v+'/'+MAX_SCALE:'–')+'</span></div>';}).join('');
 var arr=data.competencias.map(function(c){return {label:c.label,v:(typeof latest.ratings[c.key]==='number'?latest.ratings[c.key]:null)};}).filter(function(x){return x.v!=null;});
 arr.sort(function(a,b){return b.v-a.v;});
 var n=arr.length;var k=Math.min(3,Math.floor(n/2));if(k<1&&n>=1)k=1;
 var fuertes=arr.slice(0,k);var mejorar=(n>1)?arr.slice(n-k):[];
 var fH=fuertes.length?fuertes.map(function(x){return '<li><b>'+esc(x.label)+'</b> — '+x.v+'/'+MAX_SCALE+'</li>';}).join(''):'<li>—</li>';
 var mH=mejorar.length?mejorar.map(function(x){return '<li><b>'+esc(x.label)+'</b> — '+x.v+'/'+MAX_SCALE+'</li>';}).join(''):'<li>—</li>';
 var evo;
 if(evs.length>=2){var f=avg(evs[0].ratings);var l=avg(latest.ratings);var diff=Math.round((l-f)*10)/10;var arrow=diff>0?'▲':(diff<0?'▼':'▬');var sign=diff>0?'+':'';evo='<div class="evo">La media general ha pasado de <b>'+f+'</b> a <b>'+l+'</b> ('+arrow+' '+sign+diff+') a lo largo de '+evs.length+' evaluaciones.</div>';}
 else{evo='<div class="evo">Primera evaluación registrada. Con más evaluaciones se verá la progresión.</div>';}
 var chart=chartSVG(evs,'General').replace('height:100%','height:auto');
 var team=esc(g.team);
 var doc='<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Informe · '+esc(g.name)+'</title><style>'+REPORT_CSS+'</style></head><body><div class="report"><div class="rhead"><h1>'+esc(g.name)+'</h1><div class="b"><span class="cat">'+g.category+'</span>'+team+'</div>'+statsHTML+'</div><div class="rbody"><h2>Nivel actual</h2>'+bars+'<h2>Puntos fuertes y a mejorar</h2><div class="cols"><div class="col good"><div class="coltitle" style="color:#16a34a">Puntos fuertes</div><ul>'+fH+'</ul></div><div class="col work"><div class="coltitle" style="color:#d97706">A mejorar</div><ul>'+mH+'</ul></div></div><h2>Evolución</h2>'+evo+'<div class="chartbox">'+chart+'</div></div><div class="rfoot">Informe generado el '+fmtLong(todayISO())+' · Porteros FS · Maristas València</div></div></body></html>';
 return doc;
}

function shareReport(g){
 try{
  var html=buildReportHTML(g);if(!html){toast('Necesita al menos una evaluación');return;}
  var blob=new Blob([html],{type:'text/html'});
  var fname='Informe_'+slug(g.name)+'.html';
  if(typeof File!=='undefined'&&navigator.canShare){
   try{var file=new File([blob],fname,{type:'text/html'});if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Informe '+g.name}).catch(function(){});return;}}catch(e){}
  }
  var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},5000);toast('Informe descargado');
 }catch(e){toast('No se pudo generar el informe');}
}

function viewRoster(){
 var head='<div class="header"><div style="flex:1"><h1>Porteros FS</h1><div class="sub">'+data.goalkeepers.length+' portero'+(data.goalkeepers.length!==1?'s':'')+' · Maristas València</div></div><div style="display:flex;gap:6px"><button class="exp" data-action="editComp">Cualidades</button>'+(data.goalkeepers.length?'<button class="exp" data-action="export">Exportar</button>':'')+'</div></div>';
 var body='';
 if(!data.goalkeepers.length){
  body='<div class="empty"><div class="big">🧤</div><div>Aún no hay porteros.</div><div class="hint">Añade el primero con el botón de abajo.</div></div>';
 }else{
  body='<div class="wrap">';
  CATEGORIAS.forEach(function(cat){
   var list=data.goalkeepers.filter(function(g){return g.category===cat;});
   if(!list.length)return;
   body+='<div style="margin-bottom:20px"><div style="margin-bottom:8px"><span class="chip" style="'+CAT_STYLE[cat]+'">'+cat+'</span> <span style="font-size:12px;color:#94a3b8">'+list.length+'</span></div>';
   list.forEach(function(g){
    var le=latestEval(g.id);
    body+='<div class="gk-row" data-action="open" data-id="'+g.id+'"><div style="display:flex;align-items:center;gap:12px"><div class="avatar">🧤</div><div><div class="gk-name">'+esc(g.name)+'</div><div class="gk-team">'+(esc(g.team)||'Sin equipo')+'</div></div></div>'+(le?'<div class="media" style="text-align:right">'+avg(le.ratings)+'<small>media</small></div>':'')+'</div>';
   });
   body+='</div>';
  });
  body+='</div>';
 }
 return head+body+'<button class="fab" data-action="addGk">+ Portero</button>';
}

function viewProfile(){
 var g=gkById(state.selectedId);if(!g)return viewRoster();
 if(state.metric!=='General'&&!data.competencias.some(function(c){return c.key===state.metric;}))state.metric='General';
 var evs=evalsFor(g.id);var latest=evs.length?evs[evs.length-1]:null;
 var h='<div class="header"><button class="back" data-action="back">←</button><div style="flex:1"><h1 style="font-size:18px">'+esc(g.name)+'</h1><div style="display:flex;align-items:center;gap:8px;margin-top:2px"><span class="chip" style="'+CAT_STYLE[g.category]+'">'+g.category+'</span><span class="gk-team">'+(esc(g.team)||'Sin equipo')+'</span></div></div></div>';
 var b='<div class="wrap">';
 var stats=statList(g);
 if(stats.length)b+='<div class="notes-box">'+esc(stats.join(' · '))+'</div>';
 if(latest)b+='<button class="report-btn" data-action="shareReport">📄 Compartir informe (HTML)</button>';
 if(!latest){
  b+='<div class="empty-card"><div style="color:#64748b;font-size:14px">Aún no hay evaluaciones.</div><div class="hint">Añade la primera para empezar a ver su evolución.</div></div>';
 }else{
  b+='<div class="flex-between" style="margin:8px 0"><div class="sect-title" style="margin:0">Nivel actual</div><span class="gk-team">'+fmtShort(latest.date)+'</span></div><div class="card">';
  data.competencias.forEach(function(c){var v=latest.ratings[c.key];var isn=(typeof v==='number');var w=isn?Math.max(0,Math.min(100,v/MAX_SCALE*100)):0;b+='<div class="bar-row"><span class="bar-label">'+esc(c.label)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div><span class="bar-val">'+(isn?v:'–')+'</span></div>';});
  b+='</div>';
  b+='<div class="sect-title">Evolución</div><div class="metrics">';
  var mopts=[{k:'General',l:'General'}].concat(data.competencias.map(function(c){return {k:c.key,l:c.label};}));
  mopts.forEach(function(m){b+='<button class="metric'+(state.metric===m.k?' active':'')+'" data-action="metric" data-metric="'+m.k+'">'+esc(m.l)+'</button>';});
  b+='</div><div class="chart">'+chartSVG(evs,state.metric)+'</div>';
  if(evs.length<2)b+='<div class="hint" style="margin-top:4px">Con 2 o más evaluaciones verás la línea de progreso.</div>';
  b+='<div class="sect-title">Historial ('+evs.length+')</div>';
  evs.slice().reverse().forEach(function(e){b+='<div class="hist"><div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><span class="avg">'+avg(e.ratings)+'</span><span class="date">'+fmtShort(e.date)+'</span></div>'+(e.note?'<div class="note">'+esc(e.note)+'</div>':'')+'</div><button class="del" data-action="delEval" data-id="'+e.id+'">🗑</button></div>';});
 }
 b+='<button class="editgk" data-action="editGk">✎ Editar datos del portero</button>';
 b+='<button class="delgk" data-action="delGk">🗑 Eliminar portero</button></div>';
 return h+b+'<button class="fab" data-action="newEval">+ Evaluación</button>';
}

function viewGkForm(){
 var editing=!!state.editGkId;var g=editing?gkById(state.editGkId):null;
 var h='<div class="header"><button class="back" data-action="back">←</button><h1>'+(editing?'Editar portero':'Nuevo portero')+'</h1></div>';
 var b='<div class="wrap">';
 b+='<label class="f">Nombre</label><input class="t" id="gk-name" value="'+(g?esc(g.name):'')+'" placeholder="Nombre y apellido">';
 b+='<label class="f">Categoría</label><div class="catgrid">';
 CATEGORIAS.forEach(function(c){b+='<button class="catbtn'+(state.formCat===c?' active':'')+'" data-action="pickCat" data-cat="'+c+'">'+c+'</button>';});
 b+='</div>';
 b+='<label class="f">Equipo</label><input class="t" id="gk-team" value="'+(g?esc(g.team):'')+'" placeholder="Ej. Cadete A">';
 b+='<label class="f">Pierna dominante</label><div class="catgrid">';
 ['Derecha','Izquierda'].forEach(function(fo){b+='<button class="catbtn'+(state.formFoot===fo?' active':'')+'" data-action="pickFoot" data-foot="'+fo+'">'+fo+'</button>';});
 b+='</div>';
 b+='<div style="display:flex;gap:8px"><div style="flex:1"><label class="f">Edad</label><input class="t" type="number" inputmode="numeric" id="gk-age" value="'+(g&&g.age!=null?g.age:'')+'" placeholder="años"></div><div style="flex:1"><label class="f">Altura</label><input class="t" type="number" inputmode="decimal" id="gk-height" value="'+(g&&g.height!=null?g.height:'')+'" placeholder="cm"></div><div style="flex:1"><label class="f">Peso</label><input class="t" type="number" inputmode="decimal" id="gk-weight" value="'+(g&&g.weight!=null?g.weight:'')+'" placeholder="kg"></div></div>';
 b+='<button class="save" data-action="saveGk">'+(editing?'Guardar cambios':'Guardar portero')+'</button></div>';
 return h+b;
}

function viewNewEval(){
 var g=gkById(state.selectedId);if(!g)return viewRoster();
 var last=latestEval(g.id);
 var h='<div class="header"><button class="back" data-action="back">←</button><div><h1 style="font-size:18px">Nueva evaluación</h1><div class="gk-team">'+esc(g.name)+'</div></div></div>';
 var b='<div class="wrap">';
 b+='<label class="f">Fecha</label><input type="date" id="ev-date" value="'+todayISO()+'">';
 if(last)b+='<div class="hint" style="margin-top:8px">Parte de la última evaluación. Ajusta solo lo que haya cambiado (1 a 5).</div>';
 b+='<div style="margin-top:16px">';
 data.competencias.forEach(function(c){var v=(last&&typeof last.ratings[c.key]==='number')?last.ratings[c.key]:3;b+='<div class="slider-row"><div class="slider-top"><span>'+esc(c.label)+'</span><span class="slider-val" id="val-'+c.key+'">'+v+'</span></div><input type="range" min="1" max="'+MAX_SCALE+'" step="1" value="'+v+'" data-key="'+c.key+'"></div>';});
 b+='</div>';
 b+='<label class="f">Nota de la sesión (opcional)</label><textarea class="t" id="ev-note" rows="3" placeholder="Qué se trabajó, cómo respondió…"></textarea>';
 b+='<button class="save" data-action="saveEval">Guardar evaluación</button></div>';
 return h+b;
}

function viewEditComp(){
 var h='<div class="header"><button class="back" data-action="back">←</button><h1>Cualidades</h1></div>';
 var b='<div class="wrap">';
 b+='<div class="hint" style="margin-bottom:14px">Define las cualidades que evalúas. Renombra, borra o añade las que quieras (se puntúan del 1 al 5).</div>';
 state.editList.forEach(function(c,idx){
  b+='<div class="comp-row"><input class="t comp-input" data-idx="'+idx+'" value="'+esc(c.label)+'" placeholder="Nombre de la cualidad"><button class="del" data-action="delComp" data-idx="'+idx+'" style="font-size:16px;padding:4px 6px">🗑</button></div>';
 });
 b+='<div style="display:flex;gap:8px;margin-top:12px"><input class="t" id="new-comp" placeholder="Añadir cualidad…"><button class="catbtn" data-action="addComp" style="width:auto;padding:10px 16px;flex-shrink:0">Añadir</button></div>';
 b+='<button class="save" data-action="saveComp">Guardar cambios</button>';
 b+='</div>';
 return h+b;
}

function render(){
 var app=document.getElementById('app');
 if(state.view==='profile')app.innerHTML=viewProfile();
 else if(state.view==='gkForm')app.innerHTML=viewGkForm();
 else if(state.view==='newEval')app.innerHTML=viewNewEval();
 else if(state.view==='editComp')app.innerHTML=viewEditComp();
 else app.innerHTML=viewRoster();
}

function syncCompInputs(){
 document.querySelectorAll('.comp-input').forEach(function(inp){var i=Number(inp.getAttribute('data-idx'));if(state.editList[i])state.editList[i].label=inp.value;});
}

document.addEventListener('click',function(e){
 var el=e.target.closest('[data-action]');if(!el)return;
 var a=el.getAttribute('data-action');
 if(a==='open'){state.selectedId=el.getAttribute('data-id');state.view='profile';state.metric='General';render();}
 else if(a==='addGk'){state.editGkId=null;state.formCat='Benjamín';state.formFoot='';state.view='gkForm';render();}
 else if(a==='editGk'){var eg=gkById(state.selectedId);if(!eg)return;state.editGkId=eg.id;state.formCat=eg.category;state.formFoot=eg.foot||'';state.view='gkForm';render();}
 else if(a==='back'){if(state.view==='newEval'){state.view='profile';}else if(state.view==='gkForm'){var bk=state.editGkId?'profile':'roster';state.editGkId=null;state.view=bk;}else{state.view='roster';}render();}
 else if(a==='newEval'){state.view='newEval';render();}
 else if(a==='metric'){state.metric=el.getAttribute('data-metric');render();}
 else if(a==='pickCat'){state.formCat=el.getAttribute('data-cat');document.querySelectorAll('[data-action="pickCat"]').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-cat')===state.formCat);});}
 else if(a==='pickFoot'){var f=el.getAttribute('data-foot');state.formFoot=(state.formFoot===f?'':f);document.querySelectorAll('[data-action="pickFoot"]').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-foot')===state.formFoot);});}
 else if(a==='saveGk'){var name=(document.getElementById('gk-name').value||'').trim();if(!name){toast('Pon un nombre');return;}var team=(document.getElementById('gk-team').value||'').trim();var age=parseInt(document.getElementById('gk-age').value,10);if(isNaN(age))age=null;var height=num(document.getElementById('gk-height').value);var weight=num(document.getElementById('gk-weight').value);if(state.editGkId){var g=gkById(state.editGkId);g.name=name;g.category=state.formCat;g.team=team;g.foot=state.formFoot;g.age=age;g.height=height;g.weight=weight;save();state.selectedId=g.id;state.editGkId=null;state.view='profile';render();toast('Portero actualizado');}else{var gk={id:uid(),name:name,category:state.formCat,team:team,foot:state.formFoot,age:age,height:height,weight:weight};data.goalkeepers.push(gk);save();state.selectedId=gk.id;state.view='profile';state.metric='General';render();}}
 else if(a==='saveEval'){var g2=gkById(state.selectedId);if(!g2)return;var date=document.getElementById('ev-date').value||todayISO();var ratings={};document.querySelectorAll('input[type=range][data-key]').forEach(function(s){ratings[s.getAttribute('data-key')]=Number(s.value);});var ev={id:uid(),gkId:g2.id,date:date,ratings:ratings,note:(document.getElementById('ev-note').value||'').trim()};data.evaluations.push(ev);save();state.view='profile';render();toast('Evaluación guardada');}
 else if(a==='shareReport'){var gr=gkById(state.selectedId);if(gr)shareReport(gr);}
 else if(a==='delEval'){if(confirm('¿Eliminar esta evaluación?')){var id=el.getAttribute('data-id');data.evaluations=data.evaluations.filter(function(x){return x.id!==id;});save();render();}}
 else if(a==='delGk'){if(confirm('¿Eliminar este portero y todas sus evaluaciones?')){var gid=state.selectedId;data.goalkeepers=data.goalkeepers.filter(function(x){return x.id!==gid;});data.evaluations=data.evaluations.filter(function(x){return x.gkId!==gid;});save();state.selectedId=null;state.view='roster';render();}}
 else if(a==='export'){var payload=JSON.stringify(data,null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(payload).then(function(){toast('Datos copiados (JSON)');}).catch(function(){toast('No se pudo copiar');});}else{toast('No se pudo copiar');}}
 else if(a==='editComp'){state.editList=data.competencias.map(function(c){return {key:c.key,label:c.label};});state.view='editComp';render();}
 else if(a==='addComp'){syncCompInputs();var inp=document.getElementById('new-comp');var v=(inp.value||'').trim();if(!v){toast('Escribe un nombre');return;}if(state.editList.length>=12){toast('Máximo 12 cualidades');return;}state.editList.push({key:compKey(),label:v});render();}
 else if(a==='delComp'){syncCompInputs();var di=Number(el.getAttribute('data-idx'));state.editList.splice(di,1);render();}
 else if(a==='saveComp'){syncCompInputs();var cleaned=state.editList.map(function(c){return {key:c.key||compKey(),label:(c.label||'').trim()};}).filter(function(c){return c.label;});if(!cleaned.length){toast('Deja al menos una cualidad');return;}data.competencias=cleaned;if(state.metric!=='General'&&!cleaned.some(function(c){return c.key===state.metric;}))state.metric='General';save();state.view='roster';render();toast('Cualidades guardadas');}
});
document.addEventListener('input',function(e){var s=e.target.closest('input[type=range][data-key]');if(s){var d=document.getElementById('val-'+s.getAttribute('data-key'));if(d)d.textContent=s.value;}});

load();render();
</script>
</body>
</html>
